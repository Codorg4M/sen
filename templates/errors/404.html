{% extends "base.html" %}
{% block title %}404 Not Found – RideShare{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔍</div>
    <h2 style="margin-bottom: 0.5rem;">Page Not Found (404)</h2>
    <p style="color: var(--gray-600); margin-bottom: 1.5rem;">
        The page or ride you are looking for doesn't exist, has been removed, or the link is incorrect.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
